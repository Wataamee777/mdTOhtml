<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Markdown Site Builder</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/file-saver@2.0.5/dist/FileSaver.min.js"></script>

<style>
body {
  margin: 0;
  height: 100vh;
  display: grid;
  grid-template-columns: 1.3fr 1fr;
  font-family: system-ui, sans-serif;
}

/* ===== Editor ===== */
#editor {
  display: flex;
  flex-direction: column;
}

textarea {
  border: none;
  outline: none;
  font-family: monospace;
  padding: 10px;
  box-sizing: border-box;
}

#md {
  height: 70%;
  resize: none;
}

#css {
  height: 30%;
  resize: none;
  border-top: 1px solid #ccc;
}

/* ===== Preview ===== */
#preview-wrap {
  display: grid;
  grid-template-columns: 1fr 1fr;
  border-left: 1px solid #ccc;
}

#html-preview {
  background: #111;
  color: #0f0;
  padding: 10px;
  overflow: auto;
  font-size: 13px;
}

#iframe-preview {
  border: none;
  width: 100%;
  height: 100%;
}

/* ===== UI ===== */
#top-ui {
  position: fixed;
  top: 10px;
  left: 10px;
  background: #fff;
  border: 1px solid #ccc;
  padding: 6px 10px;
  font-size: 14px;
}

#controls {
  position: fixed;
  bottom: 10px;
  left: 10px;
}
</style>
</head>

<body>

<!-- ===== Editor ===== -->
<div id="editor">
  <textarea id="md" placeholder="Markdownを書く"></textarea>
  <textarea id="css" placeholder="style.css（手書き / 自動生成テンプレあり）"></textarea>
</div>

<!-- ===== Preview ===== -->
<div id="preview-wrap">
  <pre id="html-preview"></pre>
  <iframe id="iframe-preview"></iframe>
</div>

<!-- ===== UI ===== -->
<div id="top-ui">
  <label>
    <input type="checkbox" id="auto-css" checked>
    CSS自動生成
  </label>
</div>

<div id="controls">
  <button id="export">ZIP出力</button>
</div>

<script>
/* ===== marked設定 ===== */
marked.setOptions({
  headerIds: false,
  mangle: false
});

/* ===== Elements ===== */
const mdEl = document.getElementById("md");
const cssEl = document.getElementById("css");
const htmlPreview = document.getElementById("html-preview");
const iframe = document.getElementById("iframe-preview");
const autoCssToggle = document.getElementById("auto-css");

/* ===== タグ検出 ===== */
function detectTagsFromMarkdown(md) {
  const html = marked.parse(md);
  const doc = new DOMParser().parseFromString(html, "text/html");

  const allowed = [
    "h1","h2","h3","h4",
    "p","a",
    "ul","ol","li",
    "code","pre",
    "blockquote"
  ];

  const found = new Set();
  doc.body.querySelectorAll("*").forEach(el => {
    const tag = el.tagName.toLowerCase();
    if (allowed.includes(tag)) found.add(tag);
  });

  return [...found];
}

/* ===== CSS自動生成 ===== */
function autoGenerateCSS() {
  if (!autoCssToggle.checked) return;

  const tags = detectTagsFromMarkdown(mdEl.value);
  let css = cssEl.value;

  tags.forEach(tag => {
    const exists = new RegExp(`(^|\\n)\\s*${tag}\\s*\\{`, "m").test(css);
    if (!exists) {
      css += `

/* ${tag} */
${tag} {

}`;
    }
  });

  cssEl.value = css.trim();
}

/* ===== HTML生成 ===== */
function buildHTML(preview = false) {
  const cssBlock = preview
    ? `<style>${cssEl.value}</style>`
    : `<link rel="stylesheet" href="style.css">`;

  return `<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
${cssBlock}
</head>
<body>
${marked.parse(mdEl.value)}
</body>
</html>`;
}

/* ===== Render ===== */
function render() {
  const html = buildHTML(true);
  htmlPreview.textContent = html;
  iframe.srcdoc = html;
}

/* ===== Events ===== */
mdEl.addEventListener("input", () => {
  autoGenerateCSS();
  render();
});

cssEl.addEventListener("input", render);

/* ===== ZIP出力 ===== */
document.getElementById("export").onclick = async () => {
  const zip = new JSZip();
  zip.file("index.html", buildHTML(false));
  zip.file("style.css", cssEl.value);

  const blob = await zip.generateAsync({ type: "blob" });
  saveAs(blob, "site.zip");
};

/* 初期描画 */
render();
</script>

</body>
</html>
