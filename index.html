<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Markdown Visual Site Builder</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/file-saver@2.0.5/dist/FileSaver.min.js"></script>

<style>
body {
  margin: 0;
  height: 100vh;
  display: grid;
  grid-template-columns: 1.2fr 1fr;
  font-family: system-ui, sans-serif;
}

/* 入力側 */
#editor {
  display: flex;
  flex-direction: column;
}

textarea {
  width: 100%;
  box-sizing: border-box;
  border: none;
  outline: none;
  font-family: monospace;
  padding: 10px;
}

#md { height: 70%; }
#css { height: 30%; border-top: 1px solid #ccc; }

/* プレビュー側 */
#preview-wrap {
  display: grid;
  grid-template-columns: 1fr 1fr;
  border-left: 1px solid #ccc;
}

#html-preview {
  padding: 10px;
  overflow: auto;
  background: #111;
  color: #0f0;
  font-family: monospace;
  font-size: 13px;
}

#iframe-preview {
  border: none;
  width: 100%;
  height: 100%;
}

/* UI */
#css-ui {
  position: fixed;
  top: 10px;
  right: 10px;
  background: #fff;
  border: 1px solid #ccc;
  padding: 10px;
  font-size: 14px;
}

#css-ui label {
  display: block;
  margin-bottom: 6px;
}

#controls {
  position: fixed;
  bottom: 10px;
  left: 10px;
}
</style>
</head>

<body>

<!-- 入力 -->
<div id="editor">
  <textarea id="md" placeholder="Markdownを書く"></textarea>
  <textarea id="css" placeholder="CSS（視覚UI＋直編集OK）"></textarea>
</div>

<!-- プレビュー -->
<div id="preview-wrap">
  <pre id="html-preview"></pre>
  <iframe id="iframe-preview"></iframe>
</div>

<!-- 視覚CSS -->
<div id="css-ui">
  <label>
    display
    <select id="ui-display">
      <option>block</option>
      <option>flex</option>
      <option>grid</option>
      <option>none</option>
    </select>
  </label>
  <label>
    背景色
    <input type="color" id="ui-bg" value="#ffffff">
  </label>
  <label>
    文字色
    <input type="color" id="ui-color" value="#000000">
  </label>
</div>

<div id="controls">
  <button id="export">ZIP出力</button>
</div>

<script>
const mdEl = document.getElementById("md");
const cssEl = document.getElementById("css");
const htmlPreview = document.getElementById("html-preview");
const iframe = document.getElementById("iframe-preview");

const uiDisplay = document.getElementById("ui-display");
const uiBg = document.getElementById("ui-bg");
const uiColor = document.getElementById("ui-color");

const images = [];

/* UI CSS生成 */
function buildUICSS() {
  return `
body {
  display: ${uiDisplay.value};
  background: ${uiBg.value};
  color: ${uiColor.value};
}
`.trim();
}

/* HTML生成 */
function buildHTML() {
  return `<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="style.css">
<style>${cssEl.value}</style>
</head>
<body>
${marked.parse(mdEl.value)}
</body>
</html>`;
}

/* 描画 */
function render() {
  const html = buildHTML();
  htmlPreview.textContent = html;
  iframe.srcdoc = html;
}

/* UI → CSS */
function syncCSS() {
  cssEl.value = buildUICSS();
  render();
}

uiDisplay.onchange = syncCSS;
uiBg.oninput = syncCSS;
uiColor.oninput = syncCSS;

mdEl.oninput = render;
cssEl.oninput = render;

syncCSS();

/* ZIP */
document.getElementById("export").onclick = async () => {
  const zip = new JSZip();
  zip.file("index.html", buildHTML());
  zip.file("style.css", cssEl.value);

  const blob = await zip.generateAsync({ type: "blob" });
  saveAs(blob, "site.zip");
};
</script>

</body>
</html>
